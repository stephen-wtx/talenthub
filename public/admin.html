<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub - Centro de Comando Admin</title>
    
    <!-- Tipografia Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bibliotecas -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

    <!-- Fundo Vivo Futurista -->
    <div class="futuristic-bg-layer">
        <div class="cloud-img cloud-1"></div>
        <div class="cloud-img cloud-2"></div>
        <div class="cyber-orb orb-1"></div>
        <div class="cyber-orb orb-2"></div>
    </div>

    <!-- Header Administrativo -->
    <header id="main-header">
        <div class="header-container">
            <div class="header-left">
                <h2 class="logo-admin">TALENT<span>HUB</span> <span class="badge-admin">Command Center</span></h2>
            </div>
            <div class="header-right header-actions">
                <a href="index.html" class="btn-outline-small" title="Ver site"><i class="fas fa-external-link-alt"></i> <span>Ver site</span></a>
                <button onclick="confirmarSair()" class="btn-logout-admin" title="Sair"><i class="fas fa-power-off"></i> <span>Sair</span></button>
            </div>
        </div>
    </header>

    <main class="admin-main">
        <!-- Painel de Estatísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-user-tie icon-stat"></i>
                <div class="stat-info">
                    <h3>Prestadores</h3>
                    <p id="countPrestadores">0</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-users icon-stat"></i>
                <div class="stat-info">
                    <h3>Clientes</h3>
                    <p id="countClientes">0</p>
                </div>
            </div>
            <div class="stat-card stat-purple">
                <i class="fas fa-shield-alt icon-stat"></i>
                <div class="stat-info">
                    <h3>Admins</h3>
                    <p id="countAdmins">0</p>
                </div>
            </div>
            <div class="stat-card stat-amber">
                <i class="fas fa-star icon-stat"></i>
                <div class="stat-info">
                    <h3>Avaliações</h3>
                    <p id="countAvaliacoes">0</p>
                </div>
            </div>
        </div>

        <!-- Navegação por Abas -->
        <div class="tabs-container">
            <button class="tab-btn active" id="btn-prestador" onclick="renderTable('prestador')"><i class="fas fa-user-tie"></i> Prestadores</button>
            <button class="tab-btn" id="btn-cliente" onclick="renderTable('cliente')"><i class="fas fa-users"></i> Clientes</button>
            <button class="tab-btn admin-tab" id="btn-admin" onclick="renderTable('admin')"><i class="fas fa-user-shield"></i> Equipa Admin</button>
            <button class="tab-btn" id="btn-todos-servicos" onclick="renderAllServices()"><i class="fas fa-briefcase"></i> Monitor de Serviços</button>
            <button class="tab-btn" id="btn-comentarios" onclick="renderAllComments()"><i class="fas fa-comment-dots"></i> Monitor de Feedbacks</button>
            <button class="tab-btn block-tab" id="btn-bloqueado" onclick="renderTable('bloqueado')"><i class="fas fa-user-slash"></i> Suspensos</button>
        </div>

        <!-- Área de Dados / Tabela -->
        <div class="content-area">
            <table id="adminTable">
                <thead><tr id="tableHead"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Gestão -->
    <div id="modalAdm" class="modal">
        <div class="modal-content glass-panel">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2 id="modalTitle">Gestão de Conta</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="./js/admin.js"></script>
</body>
</html>
