<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub - Painel do Profissional</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/prestador.css">
</head>
<body>

<header>
    <div class="nav-left">
        <!-- O span aqui é essencial para o brilho -->
        <a href="index.html" class="logo-home">TALENT<span>HUB</span></a>
        <a href="index.html" class="btn-nav"><i class="fas fa-home"></i> Início</a>
        <a href="meus-servicos.html" class="btn-nav btn-highlight"><i class="fas fa-list-check"></i> Meus Serviços</a>
    </div>
    
    <div class="user-menu">
        <div class="user-info-header">
            <span id="nomeHeader">...</span>
            <img id="imgHeader" src="" class="foto-header">
        </div>
        <a href="perfil.html" class="btn-nav"><i class="fas fa-cog"></i> Perfil</a>
        <button class="btn-logout-icon" onclick="fazerLogout()"><i class="fas fa-power-off"></i></button>
    </div>
</header>

<main>
    <div class="section-header">
        <h2 class="glow-text">Painel do Profissional</h2>
        <p>Gerencie sua presença na rede TalentHub.</p>
    </div>

    <section class="reputation-card glass">
        <div class="rep-main-info">
            <img id="imgReputacao" src="" class="foto-perfil-rep">
            <div class="rep-stats">
                <div class="rep-number" id="mediaNota">0.0</div>
                <div class="rep-stars" id="estrelasMedia">☆☆☆☆☆</div>
                <div class="rep-info" id="totalAvaliacoes">A carregar...</div>
            </div>
        </div>
        
        <div class="rep-actions">
            <a href="meus-servicos.html" class="link-feedback">Feedbacks dos clientes <i class="fas fa-chevron-right"></i></a>
            <a href="publicar.html" class="btn-action-primary"><i class="fas fa-plus"></i> Novo Anúncio</a>
        </div>
    </section>

    <div class="sub-section-title">
        <h3><i class="fas fa-users-viewfinder"></i> Outros Talentos na Rede</h3>
    </div>
    
    <div class="preview-grid" id="listaPreview"></div>
</main>

<script src="./js/prestador.js"></script>
</body>
</html>
