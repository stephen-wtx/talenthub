<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub - Meus Serviços</title>
    
    <!-- Tipografia Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bibliotecas Externas -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link para o CSS separado -->
    <link rel="stylesheet" href="./css/ms.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

    <!-- Fundo Vivo Futurista -->
    <div class="futuristic-bg-layer">
        <div class="cloud-img cloud-1"></div>
        <div class="cloud-img cloud-2"></div>
        <div class="cyber-orb orb-1"></div>
        <div class="cyber-orb orb-2"></div>
    </div>

    <header id="main-header">
        <div class="header-container">
            <div class="nav-left">
                <a href="index.html" class="logo-home">TALENT<span>HUB</span></a>
            </div>
            <a href="prestador.html" class="btn-nav"><i class="fas fa-arrow-left"></i> Painel</a>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2 class="glow-text">Gestão de Serviços</h2>
            <div class="header-actions">
                <span id="contadorServicos" class="badge-total">A carregar...</span>
                <a href="publicar.html" class="btn-add"><i class="fas fa-plus"></i> Novo Anúncio</a>
            </div>
        </div>

        <div class="panel glass-panel">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Resumo</th>
                            <th>Preço</th>
                            <th>Bairro</th>
                            <th style="text-align: center;">Gestão</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaServicos"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Feedback -->
    <div id="modalFeed" class="modal">
        <div class="modal-content glass-panel">
            <span class="close" onclick="fecharModal('modalFeed')">&times;</span>
            <h3 id="tituloFeed"><i class="fas fa-comments"></i> Avaliações</h3>
            <div id="containerFeeds"></div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modalEdit" class="modal">
        <div class="modal-content glass-panel">
            <span class="close" onclick="fecharModal('modalEdit')">&times;</span>
            <h3><i class="fas fa-edit"></i> Editar Anúncio</h3>
            
            <form id="formEditar">
                <input type="hidden" id="editKey">
                
                <div class="form-group">
                    <label>Categoria</label>
                    <select id="editCategoria" required></select>
                </div>

                <div class="form-group">
                    <label>Descrição Detalhada</label>
                    <textarea id="editDescricao" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label>Valor do Serviço (MT)</label>
                    <input type="text" id="editValor" maxlength="6" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>

                <div class="form-group">
                    <label>Localização</label>
                    <select id="editLocal" required>
                        <option value="Natite">Natite</option>
                        <option value="Expansão">Expansão</option>
                        <option value="Cariacó">Cariacó</option>
                        <option value="Paquitequete">Paquitequete</option>
                        <option value="Alto Gingone">Alto Gingone</option>
                        <option value="Josina Machel">Josina Machel</option>
                        <option value="Muxara">Muxara</option>
                        <option value="Chuiba">Chuiba</option>
                        <option value="Maunane">Maunane</option>
                    </select>
                </div>

                <button type="submit" class="btn-save">Guardar Alterações</button>
            </form>
        </div>
    </div>

    <script src="./js/ms.js"></script>
</body>
</html>
