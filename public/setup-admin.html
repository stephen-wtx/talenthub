<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub - Setup Master</title>
    
    <!-- Bibliotecas -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/setup.css">
</head>
<body>

<div class="setup-container">
    <div class="setup-card glass">
        <div class="security-badge">
            <i class="fas fa-user-shield"></i>
        </div>
        
        <h2>Configuração Master</h2>
        <p class="subtitle">Criação de Contas Administrativas de Nível 1</p>
        
        <form id="adminForm">
            <div class="form-group master-field">
                <label><i class="fas fa-key"></i> Chave Mestra do Desenvolvedor</label>
                <input type="password" id="masterKey" placeholder="Código de Segurança UCM" required>
            </div>
            
            <div class="separator"><span>DADOS DO NOVO ADMIN</span></div>
            
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Ex: Gestor Principal" required>
            </div>
            
            <div class="form-group">
                <label>E-mail de Acesso</label>
                <input type="email" id="email" placeholder="admin@talenthub.com" required>
            </div>
            
            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <button type="submit" id="btnAcao" class="btn-create">
                <i class="fas fa-user-plus"></i> CRIAR CONTA ADMIN
            </button>
        </form>
        
        <div class="warning-link">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar ao Login do Sistema</a>
        </div>
    </div>
</div>

<script src="./js/setup.js"></script>
</body>
</html>
