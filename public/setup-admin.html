<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentHub - Setup Master</title>
    
    <!-- Tipografia Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bibliotecas -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/setup.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

    <!-- Fundo Vivo Futurista -->
    <div class="futuristic-bg-layer">
        <div class="cloud-img cloud-1"></div>
        <div class="cloud-img cloud-2"></div>
        <div class="cyber-orb orb-1"></div>
        <div class="cyber-orb orb-2"></div>
    </div>

    <div class="setup-container">
        <div class="setup-card glass-panel">
            <div class="security-badge">
                <i class="fas fa-user-shield"></i>
            </div>
            
            <h2>Configuração Master</h2>
            <p class="subtitle">Criação de Contas Administrativas de Nível 1</p>
            
            <form id="adminForm">
                <div class="form-group master-field">
                    <label for="masterKey"><i class="fas fa-key"></i> Chave Mestra do Desenvolvedor</label>
                    <input type="password" id="masterKey" placeholder="Código de Segurança UCM" required autocomplete="current-password">
                </div>
                
                <div class="separator"><span>DADOS DO NOVO ADMIN</span></div>
                
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Ex: Gestor Principal" required autocomplete="name"
                           oninput="this.value = this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '')">
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail de Acesso</label>
                    <input type="email" id="email" placeholder="admin@talenthub.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>
                
                <button type="submit" id="btnAcao" class="btn-create">
                    <i class="fas fa-user-plus"></i> CRIAR CONTA ADMIN
                </button>
            </form>
            
            <div class="warning-link">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Voltar ao Login do Sistema</a>
            </div>
        </div>
    </div>

    <script src="./js/setup.js"></script>
</body>
</html>
